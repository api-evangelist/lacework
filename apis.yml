aid: lacework
name: Lacework FortiCNAPP
description: Lacework (now Lacework FortiCNAPP under Fortinet) is a cloud-native application
  protection platform (CNAPP) that delivers vulnerability management, compliance,
  threat detection, posture management, and workload protection across AWS, Azure,
  GCP, Kubernetes, and containers. The platform uses behavioral analytics and machine
  learning on telemetry to surface anomalies without per-rule tuning. The Lacework
  FortiCNAPP REST API uses bearer-token authentication to manage policies, events,
  alerts, resources, queries, and integrations programmatically.
